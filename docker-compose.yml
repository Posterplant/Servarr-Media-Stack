networks:
  media-network:
    name: media-network
    driver: bridge

volumes:
  mysql_data:
  romm_resources:
  romm_redis_data:

###########################################################################
##  Docker Compose File:    Gluetun (qmcgaw)                             ##
##  Function:               VPN Client                                   ##
##  Documentation:          https://github.com/qdm12/gluetun-wiki        ##
###########################################################################
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: always
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8888:8888/tcp"                         # Gluetun Local Network HTTP proxy
      - "8388:8388/tcp"                         # Gluetun Local Network Shadowsocks
      - "8388:8388/udp"                         # Gluetun Local Network Shadowsocks
      - "${WEBUI_PORT_QBITTORRENT:?err}:${WEBUI_PORT_QBITTORRENT:?err}"   # WebUI Portal: qBittorrent
      - "${QBIT_PORT_TCP:?err}:6881/tcp"        # Transmission Torrent Port TCP
      - "${QBIT_PORT_UDP:?err}:6881/udp"        # Transmission Torrent Port UDP
      - "${WEBUI_PORT_SLSKD:?err}:5030"         # WebUI Portal: Soulseek 
      - "${SLSKD_PORT_PEER:?err}:50300/tcp"     # Soulseek Peer Port TCP

    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/gluetun:/gluetun
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - FIREWALL_OUTBOUND_SUBNETS=${LOCAL_SUBNET:?err}
      - HTTPPROXY=on
      - SHADOWSOCKS=on

      - VPN_TYPE=${VPN_TYPE:?err}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:?err}
# These are optional
      - SERVER_REGIONS=${SERVER_REGIONS}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - SERVER_CITIES=${SERVER_CITIES}
      - SERVER_HOSTNAMES=${SERVER_HOSTNAMES}

# Environment Variables for OpenVPN connections.
      - OPENVPN_USER=${VPN_USERNAME}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - OPENVPN_CUSTOM_CONFIG=${OPENVPN_CUSTOM_CONFIG}

# Environment Variables for wireguard VPN connections.
      - VPN_ENDPOINT_IP=${VPN_ENDPOINT_IP}
      - VPN_ENDPOINT_PORT=${VPN_ENDPOINT_PORT}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}

# NOTE: Gluetun VPN container MUST ONLY connect to the media-network

    networks:
      - media-network

###########################################################################
##  Docker Compose File:  qBittorrent (LinuxServer.io)
##  Function:             Torrent Download Client
##  Documentation:        https://docs.linuxserver.io/images/docker-qbittorrent
###########################################################################
  qbittorrent:
    image: linuxserver/qbittorrent:4.6.0
    container_name: qbittorrent
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/qbittorrent:/config
      - ${FOLDER_FOR_MEDIA:?err}:/data
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - WEBUI_PORT=${WEBUI_PORT_QBITTORRENT:?err}
      # - DOCKER_MODS=ghcr.io/gilbn/theme.park:qbittorrent
      # - TP_THEME=${TP_THEME:?err}

## Do Not Change Network for qBittorrent
## qBittorrent MUST always use a VPN / Secure Internet connection

    network_mode: "service:gluetun"

###########################################################################
##  Docker Compose File:  Slskd (slskd)
##  Function:             Soulseek Daemon / Client
##  Documentation:        https://github.com/slskd/slskd/
###########################################################################
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    # Soulseek needs two config volumes, one for the data and one for the config file.  
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/slskd/data:/app/data
      - ${FOLDER_FOR_CONFIGS:?err}/slskd/slskd.yml:/app/slskd.yml
      - ${FOLDER_FOR_MEDIA:?err}/data/soulseek/downloads:/app/downloads
      - ${FOLDER_FOR_MEDIA:?err}/data/soulseek/incomplete:/app/incomplete
      # If you want to share your music library with Soulseek, uncomment the following line and set the correct path to your music library.
      # - ${FOLDER_FOR_MEDIA:?err}/media/music:/app/music:ro
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - SLSKD_REMOTE_CONFIGURATION=true

## slskd MUST always use a VPN / Secure Internet connection
    network_mode: "service:gluetun"

