###########################################################################
##  Docker Compose File:  Romm (rommapp/romm)
##  Function:             Emulator ROM Library Manager
##  Documentation:        https://github.com/rommapp/romm
###########################################################################
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    depends_on:
      romm-db:
        condition: service_healthy
    ports:
      - "${WEBUI_PORT_ROMM:?err}:8080"
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DB_HOST=romm-db
      - DB_NAME=romm                                        # Should match MARIADB_DATABASE in mariadb
      - DB_USER=${ROMM_USER:?err}                           # Should match MARIADB_USER in mariadb
      - DB_PASSWD=${ROMM_PASSWORD:?err}                     # Should match MARIADB_PASSWORD in mariadb
      - ROMM_AUTH_SECRET_KEY=${OPENSSL_SECRET:?err}         # Generate a key with `openssl rand -hex 32`
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER-}         # Optional metadata provider
      - SCREENSCRAPER_PASSWORD=${SCREENSCRAPER_PASSWORD-} # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#screenscraper
      - RETROACHIEVEMENTS_API_KEY=${RETROACHIEVEMENTS_API_KEY-} # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#retroachievements
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY-}       # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#steamgriddb
      - HASHEOUS_API_ENABLED=true                           # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#hasheous
      - PLAYMATCH_API_ENABLED=true                          # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#playmatch
      - FLASHPOINT_API_ENABLED=true                         # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#flashpoint
      - HLTB_API_ENABLED=true                               # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#howlongtobeat
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID-}                 # Optional metadata provider
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET-}         # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#igdb
      - SCAN_WORKERS=4                                      # How many ROMs to scan at once
      - WEB_SERVER_CONCURRENCY=4                            # Workers for API calls, raise for several concurrent users
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/romm:/romm/config
      - ${FOLDER_FOR_MEDIA:?err}/roms:/romm/library
      - romm_resources:/romm/resources
    networks:
      - media-network

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?err}
      - MARIADB_DATABASE=romm
      - MARIADB_USER=${ROMM_USER:?err}
      - MARIADB_PASSWORD=${ROMM_PASSWORD:?err}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - media-network

###########################################################################
##  Docker Compose File:  Unpackerr (Hotio.Dev)
##  Function:             Archive Media Extraction
##  Documentation:        https://github.com/davidnewhall/unpackerr
##                        https://github.com/davidnewhall/unpackerr/blob/master/examples/docker-compose.yml
###########################################################################
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/unpackerr:/config
      - ${FOLDER_FOR_MEDIA:?err}/:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
# Documentation on all Environment Variables can be found at:
# https://github.com/Unpackerr/unpackerr/blob/main/examples/docker-compose.yml
# https://notifiarr.com/unpackerr
      - UN_DEBUG=false
      - UN_LOG_FILE=
      - UN_LOG_FILES=10
      - UN_LOG_FILE_MB=10
      - UN_INTERVAL=2m
      - UN_START_DELAY=1m
      - UN_RETRY_DELAY=5m
      - UN_MAX_RETRIES=3
      - UN_PARALLEL=1
      - UN_FILE_MODE=0664
      - UN_DIR_MODE=0775
      # Sonarr Config - Copy API Key from: http://sonarr:8989/general/settings
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/data/torrents/anime
      - UN_SONARR_0_PATHS_1=/data/torrents/series
      - UN_SONARR_0_PROTOCOLS=torrent
      - UN_SONARR_0_TIMEOUT=10s
      - UN_SONARR_0_DELETE_ORIG=false
      - UN_SONARR_0_DELETE_DELAY=5m
      # Radarr Config - Copy API Key from: http://radarr:7878/general/settings
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/data/torrents/movies
      - UN_RADARR_0_PROTOCOLS=torrent
      - UN_RADARR_0_TIMEOUT=10s
      - UN_RADARR_0_DELETE_ORIG=false
      - UN_RADARR_0_DELETE_DELAY=5m
      # Lidarr Config - Copy API Key from: http://lidarr:8686/general/settings
      - UN_LIDARR_0_URL=http://lidarr:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY}
      - UN_LIDARR_0_PATHS_0=/data/torrents/music
      - UN_LIDARR_0_PATHS_1=/data/soulseek/downloads
      - UN_LIDARR_0_PROTOCOLS=torrent
      - UN_LIDARR_0_TIMEOUT=10s
      - UN_LIDARR_0_DELETE_ORIG=false
      - UN_LIDARR_0_DELETE_DELAY=5m

    security_opt:
      - no-new-privileges:true
    networks:
      - media-network
