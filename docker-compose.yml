###########################################################################
##  Docker Compose File:  Soularr (mrusse08)
##  Function:             Connect Soulseek with Lidarr
##  Documentation:        https://www.soularr.net/
###########################################################################
  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    restart: unless-stopped
    hostname: soularr
    # we have to set the user to the same as the host user,
    # otherwise we get permission issues with the downloads folder.
    # only this container needs the user: parameter,
    # everything else uses the PUID and PGID environment variables
    user: ${PUID:?err}:${PGID:?err} 
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/soularr:/data
      - ${FOLDER_FOR_MEDIA:?err}/data/soulseek/downloads:/downloads
      - ${FOLDER_FOR_MEDIA:?err}/data/soulseek/downloads:/app/downloads
    ports:
      - "${WEBUI_PORT_SOULARR:?err}:8265"
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - SCRIPT_INTERVAL=300
      - WEBUI_ENABLED=true
      - WEBUI_PORT=8265
      - log_to_file=True
    networks:
      - media-network
    
